  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow-y: scroll; }
  body { font-family:'Space Grotesk',sans-serif; background:#F0F1ED; color:#1B2430; }

  .sub { font-size:17px; line-height:1.6; color:#1B2430cc; margin-bottom:56px; }

  .email-wrap { padding:0 48px 160px; max-width:700px; margin:0 auto; }
  .email { font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:#DD5E1E; text-decoration:none; overflow-wrap:anywhere; }
  .email:hover { text-decoration:underline; }
  @media (max-width:900px) { .email-wrap { padding:0 24px 120px; } }
  @media (max-width:560px) { .email { font-size:22px; } }

  footer { padding:40px 48px; border-top:1px solid #1B24301a; font-family:'JetBrains Mono',monospace; font-size:12px; color:#1B243088; }
