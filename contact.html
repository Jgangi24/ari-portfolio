<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact — Ari Berenson</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Space Grotesk',sans-serif; background:#F0F1ED; color:#1B2430; }

  .nav { display:flex; justify-content:space-between; align-items:center; padding:32px 48px; border-bottom:1px solid #1B24301a; }
  .nav .mark { font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
  .nav .links { display:flex; gap:32px; font-size:13px; font-weight:500; }
  .nav .links span:hover { color:#DD5E1E; cursor:pointer; }
  .nav .links span.current { color:#DD5E1E; }

  .hero-wrap { padding:80px 48px 8px; max-width:700px; }
  .eyebrow { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.05em; background:#1B2430; color:#F0F1ED; padding:5px 12px; border-radius:2px; margin-bottom:24px; }
  h1.title { font-family:'Fraunces',serif; font-size:52px; font-weight:600; line-height:1.1; letter-spacing:-0.01em; margin-bottom:16px; }
  h1.title .accent { color:#DD5E1E; font-style:italic; }
  .sub { font-size:17px; line-height:1.6; color:#1B2430cc; margin-bottom:56px; }

  form { padding:0 48px 120px; max-width:640px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  .field { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  label { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.04em; color:#1B243099; }
  label .req { color:#DD5E1E; }
  input, textarea {
    font-family:'Space Grotesk',sans-serif; font-size:15px; padding:14px 16px;
    border:1px solid #1B24302a; border-radius:6px; background:#fff; color:#1B2430;
    outline:none; transition:border-color .15s;
  }
  input:focus, textarea:focus { border-color:#DD5E1E; }
  textarea { resize:vertical; min-height:140px; }

  button {
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    background:#DD5E1E; color:#fff; border:none; padding:16px 32px;
    border-radius:6px; cursor:pointer; transition:transform .15s, box-shadow .15s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 8px 20px -8px #DD5E1E88; }

  footer { padding:40px 48px; border-top:1px solid #1B24301a; font-family:'JetBrains Mono',monospace; font-size:12px; color:#1B243088; }
</style>
</head>
<body>

<div class="nav">
  <div class="mark">Ari Berenson</div>
  <div class="links"><a href="index.html">Work</a><a href="about.html">About</a><a href="resume.pdf" target="_blank">Resume</a><a href="contact.html" class="current">Contact</a></div>
</div>

<div class="hero-wrap">
  <div class="eyebrow">CONTACT</div>
  <h1 class="title">Let's work <span class="accent">together.</span></h1>
  <p class="sub">Have a project in mind, or just want to talk shop? Fill out the form below and I'll get back to you.</p>
</div>

<form>
  <div class="row">
    <div class="field">
      <label>First Name <span class="req">(required)</span></label>
      <input type="text" name="firstName" required>
    </div>
    <div class="field">
      <label>Last Name <span class="req">(required)</span></label>
      <input type="text" name="lastName" required>
    </div>
  </div>

  <div class="field">
    <label>Email <span class="req">(required)</span></label>
    <input type="email" name="email" required>
  </div>

  <div class="field">
    <label>Subject <span class="req">(required)</span></label>
    <input type="text" name="subject" required>
  </div>

  <div class="field">
    <label>Message <span class="req">(required)</span></label>
    <textarea name="message" required></textarea>
  </div>

  <button type="submit">Submit</button>
</form>

<footer>© Ari Berenson</footer>

</body>
</html>
